<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Tracker | RPG Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
  <script type="module" crossorigin src="/atomic-tracker/assets/index-DedOvtnt.js"></script>
  <link rel="stylesheet" crossorigin href="/atomic-tracker/assets/index-X7tVcbYq.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>ATOMIC TRACKER</h1>
            
            <div class="stats-container">
                <div class="stat-item">
                    <div class="stat-label">HP <span id="hp-text">50/50</span></div>
                    <div class="bar-background">
                        <div id="hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-label">XP <span id="xp-text">0/100</span></div>
                    <div class="bar-background">
                        <div id="xp-fill" class="bar-fill xp-fill" style="width: 0%;"></div>
                    </div>
                </div>
                
                <div class="level-badge">
                    LEVEL <span id="user-level">1</span>
                </div>
            </div>
        </header>

        <main>
            <ul id="habits-list" class="habits-grid">
                </ul>
        </main>
    </div>

</body>
</html>
